spring.application.name=backend

# ==========================================
# DATABASE CONFIGURATION
# Option 1: H2 In-Memory (no MySQL needed - for quick testing)
# Option 2: MySQL (comment out H2 section, uncomment MySQL section)
# ==========================================

# H2 In-Memory Database (Active - no MySQL needed)
spring.datasource.url=jdbc:h2:mem:insurai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Database (Uncomment when MySQL is ready)
# spring.datasource.url=jdbc:mysql://localhost:3306/insurai?useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=insurai_user
# spring.datasource.password=insurai123
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=InsurAI_JWT_SECRET_2025@secure
jwt.expiration=86400000

# Server Port
server.port=8080

# Google Gemini AI API Key (Set via environment variable GEMINI_API_KEY)
GEMINI_API_KEY=${GEMINI_API_KEY:your_gemini_api_key_here}

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
